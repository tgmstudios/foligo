# Side-effect posture (verified against api/src at b13f4f9): the API has NO background workers, mailer, billing or sync jobs.
# Outbound integrations are only: AI providers (keys live in DB ai_models/ai_provider_configs/voice_providers -> neutralized by neutralize.sql),
# GitHub OAuth (GITHUB_OAUTH_* intentionally NOT set; user_integrations tokens neutralized), SearXNG (SEARXNG_URL intentionally unset),
# ElevenLabs voice (env + DB unset), SSO IdP (sso_providers disabled). Egress is additionally blocked by NetworkPolicy.
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: foligo-staging}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: api-fstg.i.tgm.one/foligo-staging/api@sha256:69f51b2915c8097d04f9d4822bb9fdb3602056e56fb31217d64d36b442708dfd
          imagePullPolicy: IfNotPresent
          ports: [{name: web, containerPort: 3000}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
            - {name: ALLOW_PUBLIC_SIGNUPS, value: "false"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: foligo-staging-api, key: DATABASE_URL}}
            - {name: REDIS_URL, value: "redis://redis:6379"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: foligo-staging-api, key: JWT_SECRET}}
            - {name: JWT_EXPIRES_IN, value: 7d}
            - name: ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: foligo-staging-api, key: ENCRYPTION_KEY}}
            - name: ANALYTICS_HASH_SALT
              valueFrom: {secretKeyRef: {name: foligo-staging-api, key: ANALYTICS_HASH_SALT}}
            - {name: MAX_FILE_SIZE, value: "52428800"}
            - {name: MINIO_ENDPOINT, value: minio}
            - {name: MINIO_PORT, value: "9000"}
            - {name: MINIO_USE_SSL, value: "false"}
            - name: MINIO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: foligo-staging-minio, key: accessKey}}
            - name: MINIO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: foligo-staging-minio, key: secretKey}}
            - {name: MINIO_BUCKET_NAME, value: foligo}
            - {name: MINIO_PUBLIC_URL, value: "https://api-fstg.i.tgm.one/minio-unavailable-in-staging"}
            - {name: API_DOCS_PATH, value: /api-docs}
            - {name: FRONTEND_URL, value: "https://app-fstg.i.tgm.one"}
            - {name: API_URL, value: "https://api-fstg.i.tgm.one"}
            - {name: API_DOMAIN, value: api-fstg.i.tgm.one}
            - {name: FRONTEND_DOMAIN, value: app-fstg.i.tgm.one}
            - {name: ADDITIONAL_CORS_ORIGINS, value: ""}
            - {name: AI_HTTPS_PROXY, value: "http://ai-egress:3128"}
            - {name: AI_DEFAULT_PROVIDER, value: custom}
            - {name: AI_FALLBACK_CHAIN, value: ""}
            # Stripe test-only values in foligo-staging-api Secret.
            - name: STRIPE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: foligo-staging-api, key: STRIPE_SECRET_KEY}}
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom: {secretKeyRef: {name: foligo-staging-api, key: STRIPE_PUBLISHABLE_KEY}}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: foligo-staging-api, key: STRIPE_WEBHOOK_SECRET, optional: true}}
            - name: BILLING_FREE_MONTHLY_REQUESTS
              value: "10"
            - name: BILLING_FREE_MONTHLY_COST_USD
              value: "0.10"
            - name: BILLING_PLANS
              value: '[{"key":"pro","name":"Foligo Pro","priceId":"price_1UYwjsJALC4njetQ5GqMm2gr","monthlyRequests":300,"monthlyTokens":null,"monthlyCostUsd":2},{"key":"max","name":"Foligo Max","priceId":"price_1UYwjsJALC4njetQhOqk5yF0","monthlyRequests":1500,"monthlyTokens":null,"monthlyCostUsd":8}]'
          readinessProbe: {httpGet: {path: /health, port: web}, periodSeconds: 5, failureThreshold: 30}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {memory: 1536Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: foligo-staging}
spec:
  selector: {app: api}
  ports: [{name: web, port: 3000, targetPort: web}]
