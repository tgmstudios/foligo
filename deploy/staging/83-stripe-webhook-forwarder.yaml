# NOT included by deploy/staging/kustomization.yaml: Stripe CLI listener startup generates a
# per-listener signing secret. Use the operator-managed, verified listener whose matching
# STRIPE_WEBHOOK_SECRET is stored in foligo-staging-api; do not deploy a second listener unless
# its generated secret is synchronized to that API Secret through an approved secret workflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe-webhook-forwarder
  namespace: foligo-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stripe-webhook-forwarder
  template:
    metadata:
      labels:
        app: stripe-webhook-forwarder
    spec:
      containers:
        - name: stripe
          image: stripe/stripe-cli:v1.35.0
          command: ["/bin/sh", "-ec"]
          args: ["stripe listen --api-key \"$STRIPE_SECRET_KEY\" --forward-to https://api-fstg.i.tgm.one/api/billing/webhook"]
          env:
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: foligo-staging-api
                  key: STRIPE_SECRET_KEY
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
