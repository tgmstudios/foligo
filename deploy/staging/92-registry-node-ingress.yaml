apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-staging-registry-node-pulls
  namespace: nginx-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: nginx-private
      app.kubernetes.io/name: ingress-nginx
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.168.102.21/32}
        - ipBlock: {cidr: 192.168.102.22/32}
        - ipBlock: {cidr: 192.168.102.23/32}
        - ipBlock: {cidr: 192.168.102.24/32}
        - ipBlock: {cidr: 192.168.102.25/32}
        - ipBlock: {cidr: 192.168.103.21/32}
        - ipBlock: {cidr: 192.168.103.22/32}
        - ipBlock: {cidr: 192.168.103.23/32}
        - ipBlock: {cidr: 192.168.103.24/32}
        - ipBlock: {cidr: 192.168.103.25/32}
        - ipBlock: {cidr: 10.42.4.0/32}
        - ipBlock: {cidr: 10.42.8.0/32}
        - ipBlock: {cidr: 10.42.3.0/32}
        - ipBlock: {cidr: 10.42.2.0/32}
        - ipBlock: {cidr: 10.42.6.0/32}
      ports: [{protocol: TCP, port: 443}]
