# Staging-only image registry, reachable by the Foligo ARC release runner only.
# Nodes pull via 127.0.0.1:32551 (containerd permits plain HTTP on loopback).
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: registry, namespace: foligo-staging}
spec:
  serviceName: registry
  replicas: 1
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2
          ports: [{name: http, containerPort: 5000}]
          env: [{name: REGISTRY_STORAGE_DELETE_ENABLED, value: "false"}]
          readinessProbe: {httpGet: {path: /v2/, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
  volumeClaimTemplates:
    - metadata: {name: data, labels: {app: registry}}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: proxmox-ssd-zfs
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: foligo-staging}
spec:
  type: NodePort
  selector: {app: registry}
  ports: [{name: http, port: 5000, targetPort: http, nodePort: 32551}]
