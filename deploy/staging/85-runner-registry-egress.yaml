apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-foligo-runner-to-staging-registry
  namespace: arc-runners-onprem
  labels:
    tgm.one/netpol: egress
spec:
  podSelector:
    matchLabels:
      actions.github.com/organization: tgmstudios
      actions.github.com/repository: foligo
      actions.github.com/scale-set-name: tgmstudios-runners
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: foligo-staging
          podSelector:
            matchLabels:
              app: registry
      ports:
        - protocol: TCP
          port: 5000
