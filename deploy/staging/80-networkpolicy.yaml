# Default deny; allow intra-namespace, DNS, ingress-controller -> web pods,
# the exact Foligo ARC runner -> registry, and sites/api -> private ingress only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: foligo-staging}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-intra-namespace-and-dns, namespace: foligo-staging}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-private-ingress-controller, namespace: foligo-staging}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [api, dashboard, sites]}]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: nginx-private}}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: nginx-private}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-registry-nodeport, namespace: foligo-staging}
spec:
  podSelector: {matchLabels: {app: registry}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: arc-runners-onprem}}
          podSelector: {matchLabels: {actions.github.com/scale-set-name: tgmstudios-runners, actions.github.com/repository: foligo}}
      ports: [{protocol: TCP, port: 5000}]
    - from:
        - ipBlock: {cidr: 192.168.102.21/32}
        - ipBlock: {cidr: 192.168.102.22/32}
        - ipBlock: {cidr: 192.168.102.23/32}
        - ipBlock: {cidr: 192.168.102.24/32}
        - ipBlock: {cidr: 192.168.102.25/32}
      ports: [{protocol: TCP, port: 5000}]
