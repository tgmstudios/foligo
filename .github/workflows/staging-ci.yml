name: Staging CI

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to on-prem staging (requires explicit DB-refresh acceptance)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: foligo-staging-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    if: github.ref == 'refs/heads/staging'
    runs-on: tgmstudios-runners
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Reject stale staging commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/staging)" = "${GITHUB_SHA}"
      - name: Validate staging manifest topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'namespace: foligo-staging' deploy/staging/50-api.yaml)" -ge 1
          grep -q '127.0.0.1:32551/foligo-staging/api@sha256:' deploy/staging/50-api.yaml
          grep -q '127.0.0.1:32551/foligo-staging/dashboard@sha256:' deploy/staging/60-dashboard.yaml
          grep -q '127.0.0.1:32551/foligo-staging/sites@sha256:' deploy/staging/70-sites.yaml
          ! grep -R -E 'registry\.tgm\.one/foligo/(api|dashboard|sites):' deploy/staging/50-api.yaml deploy/staging/60-dashboard.yaml deploy/staging/70-sites.yaml
          ! grep -E 'kubectl (apply|delete)|prisma (db push|migrate resolve)' deploy/staging/scripts/*.sh
      - name: Build API image (no publish during gated phase)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/.docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: foligo-staging/api:${{ github.sha }}
      - name: Build dashboard image (no publish during gated phase)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dashboard/.docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: foligo-staging/dashboard:${{ github.sha }}
      - name: Build sites image (no publish during gated phase)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sites/.docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: foligo-staging/sites:${{ github.sha }}

  deployment-gate:
    if: github.ref == 'refs/heads/staging' && github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: validate
    runs-on: tgmstudios-runners
    steps:
      - name: Stop until release prerequisites are approved
        shell: bash
        run: |
          echo 'Deployment is intentionally disabled until DB refresh/migration acceptance, staging registry reachability/auth, and a narrowly scoped deployment credential are verified.'
          exit 1
