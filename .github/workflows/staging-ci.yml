name: Staging CI

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to on-prem staging (requires explicit DB-refresh acceptance)
        required: true
        type: boolean
        default: false
      db_refresh_accepted:
        description: Confirm DB refresh and exact migration rehearsal were accepted
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: foligo-staging-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    if: github.ref == 'refs/heads/staging'
    runs-on: tgmstudios-runners
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Reject stale staging commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/staging:refs/remotes/origin/staging
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/staging)" = "${GITHUB_SHA}"
      - name: Validate staging manifest topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'namespace: foligo-staging' deploy/staging/50-api.yaml)" -ge 1
          grep -q 'api-fstg.i.tgm.one/foligo-staging/api@sha256:' deploy/staging/50-api.yaml
          grep -q 'api-fstg.i.tgm.one/foligo-staging/dashboard@sha256:' deploy/staging/60-dashboard.yaml
          grep -q 'api-fstg.i.tgm.one/foligo-staging/sites@sha256:' deploy/staging/70-sites.yaml
          ! grep -R -E 'registry\.tgm\.one/foligo/(api|dashboard|sites):' deploy/staging/50-api.yaml deploy/staging/60-dashboard.yaml deploy/staging/70-sites.yaml
          ! grep -R -E 'kubectl apply|prisma (db push|migrate resolve)' deploy/staging/scripts/*.sh
      - name: Offline runtime and rollout regressions
        shell: bash
        run: |
          python3 deploy/staging/scripts/validate-runtime.py
          python3 deploy/staging/scripts/test-rollout.py
      - name: Preflight regression tests
        shell: bash
        run: bash deploy/staging/scripts/test-preflight.sh
      - name: Build API image (no publish during gated phase)
        if: github.event_name == 'workflow_dispatch' && !inputs.deploy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/.docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: foligo-staging/api:${{ github.sha }}
      - name: Build dashboard image (no publish during gated phase)
        if: github.event_name == 'workflow_dispatch' && !inputs.deploy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dashboard/.docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: foligo-staging/dashboard:${{ github.sha }}
      - name: Build sites image (no publish during gated phase)
        if: github.event_name == 'workflow_dispatch' && !inputs.deploy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sites/.docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: foligo-staging/sites:${{ github.sha }}

  deployment-gate:
    if: github.ref == 'refs/heads/staging' && github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.db_refresh_accepted
    needs: validate
    runs-on: tgmstudios-runners
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Create dedicated short-lived staging deploy identity
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          KUBERNETES_API_HOST: 192.168.102.11
        run: deploy/staging/scripts/create-release-kubeconfig.sh
      - name: Install checksum-verified kubectl for RKE2
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          version=v1.32.9
          binary="$RUNNER_TEMP/kubectl-$version"
          curl --fail --silent --show-error --location --max-time 60 \
            "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl" \
            --output "$binary"
          expected=$(curl --fail --silent --show-error --location --max-time 20 \
            "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl.sha256")
          printf '%s  %s\n' "$expected" "$binary" | sha256sum --check --status
          chmod 0755 "$binary"
          ln -sf "$binary" "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Live staging preflight and real node image pull
        shell: bash
        run: |
          bash deploy/staging/scripts/preflight.sh
          KUBECONFIG="$STAGING_KUBECONFIG" python3 deploy/staging/scripts/pull-preflight.py
      - name: Publish immutable staging images
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          output=$(deploy/staging/scripts/release.sh publish)
          printf '%s\n' "$output"
          for component in api dashboard sites; do
            digest=$(printf '%s\n' "$output" | awk -F= -v key="$component" '$1 == key {print $2}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "${component}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Deploy only after DB refresh and migration acceptance
        shell: bash
        env:
          STAGING_SHA: ${{ github.sha }}
          STAGING_API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          STAGING_DASHBOARD_DIGEST: ${{ steps.publish.outputs.dashboard_digest }}
          STAGING_SITES_DIGEST: ${{ steps.publish.outputs.sites_digest }}
          DB_REFRESH_ACCEPTED: ${{ inputs.db_refresh_accepted }}
          STAGING_DEPLOY_APPROVED: ${{ inputs.deploy }}
        run: deploy/staging/scripts/release.sh deploy
      - name: Remove temporary staging release credential
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/foligo-staging-kubeconfig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
