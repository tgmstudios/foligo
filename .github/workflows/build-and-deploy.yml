name: Build and Deploy

on:
  push:
    branches: [ "main" , "staging" ]

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to TGM Docker Registry
      uses: docker/login-action@v3
      with:
        registry: registry.tgm.one
        username: robot$foligo+github
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push API
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        file: ./api/.docker/Dockerfile
        push: true
        tags: |
          registry.tgm.one/foligo/api:latest
          registry.tgm.one/foligo/api:${{ github.sha }}
        cache-from: type=registry,ref=registry.tgm.one/foligo/api:latest
        cache-to: type=inline

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to TGM Docker Registry
      uses: docker/login-action@v3
      with:
        registry: registry.tgm.one
        username: robot$foligo+github
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Dashboard
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        file: ./dashboard/.docker/Dockerfile
        push: true
        tags: |
          registry.tgm.one/foligo/dashboard:latest
          registry.tgm.one/foligo/dashboard:${{ github.sha }}
        cache-from: type=registry,ref=registry.tgm.one/foligo/dashboard:latest
        cache-to: type=inline

  build-sites:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to TGM Docker Registry
      uses: docker/login-action@v3
      with:
        registry: registry.tgm.one
        username: robot$foligo+github
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Sites
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        file: ./sites/.docker/Dockerfile
        push: true
        tags: |
          registry.tgm.one/foligo/sites:latest
          registry.tgm.one/foligo/sites:${{ github.sha }}
        cache-from: type=registry,ref=registry.tgm.one/foligo/sites:latest
        cache-to: type=inline

  deploy:
    needs: [build-api, build-dashboard, build-sites]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Rancher
      run: |
        TOKEN="${{ secrets.RANCHER_TOKEN }}"
        CLUSTER="c-lx99g"
        RANCHER="https://rancher.tgm.one"
        TS=$(date -u +%s)

        deploy() {
          local app=$1
          local image="registry.tgm.one/foligo/${app}:latest"

          echo "[${app}] Updating to ${image}..."
          HTTP_CODE=$(curl -s -o /tmp/deploy_resp.txt -w "%{http_code}" \
            -X PATCH \
            -u "${TOKEN}" \
            -H "Content-Type: application/strategic-merge-patch+json" \
            -d "{\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"deployed-at\":\"${TS}\"}},\"spec\":{\"containers\":[{\"name\":\"${app}\",\"image\":\"${image}\",\"imagePullPolicy\":\"Always\"}]}}}}" \
            "${RANCHER}/k8s/clusters/${CLUSTER}/v1/apps.deployments/${NS}/${app}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "[${app}] OK"
          else
            echo "[${app}] FAIL (HTTP ${HTTP_CODE})"
            cat /tmp/deploy_resp.txt
          fi
        }

        BRANCH="${GITHUB_REF#refs/heads/}"
        if [ "$BRANCH" = "main" ]; then
          NS=foligo
        elif [ "$BRANCH" = "staging" ]; then
          NS=foligo-staging
        else
          echo "Skipping deploy for branch: $BRANCH"
          exit 0
        fi

        deploy "api"
        deploy "dashboard"
        deploy "sites"
