name: Build and Deploy

on:
  push:
    branches: ["main", "staging"]

# Only the newest commit on a branch should publish its images. Besides saving
# runner capacity, this prevents an older, slower build from overwriting latest.
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    runs-on: tgmstudios-runners
    steps:
      - uses: actions/checkout@v4

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TGM Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tgm.one
          username: robot$foligo+github
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate API Tag Names
        run: |
          echo "${{ steps.extract_branch.outputs.branch }}"
          if [ ${{ steps.extract_branch.outputs.branch }} = "main" ]; then
            echo "TAG_LATEST_API=api:latest" >> $GITHUB_ENV
            echo "TAG_COMMIT_API=api:$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          elif [ ${{ steps.extract_branch.outputs.branch }} = "staging" ]; then
            echo "TAG_LATEST_API=api-stage:latest" >> $GITHUB_ENV
            echo "TAG_COMMIT_API=api-stage:$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          else
            exit 0
          fi

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          file: ./api/.docker/Dockerfile
          push: true
          tags: |
            registry.tgm.one/foligo/${{ env.TAG_LATEST_API }}
            registry.tgm.one/foligo/${{ env.TAG_COMMIT_API }}
          cache-from: type=registry,ref=registry.tgm.one/foligo/api:buildcache-${{ github.ref_name }}
          cache-to: type=registry,ref=registry.tgm.one/foligo/api:buildcache-${{ github.ref_name }},mode=max

  build-dashboard:
    runs-on: tgmstudios-runners
    steps:
      - uses: actions/checkout@v4

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TGM Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tgm.one
          username: robot$foligo+github
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Website Tag Names
        run: |
          echo "${{ steps.extract_branch.outputs.branch }}"
          if [ ${{ steps.extract_branch.outputs.branch }} = "main" ]; then
            echo "TAG_LATEST_DASHBOARD=dashboard:latest" >> $GITHUB_ENV
            echo "TAG_COMMIT_DASHBOARD=dashboard:$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          elif [ ${{ steps.extract_branch.outputs.branch }} = "staging" ]; then
            echo "TAG_LATEST_DASHBOARD=dashboard-stage:latest" >> $GITHUB_ENV
            echo "TAG_COMMIT_DASHBOARD=dashboard-stage:$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          else
            exit 0
          fi

      - name: Build and push Dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          file: ./dashboard/.docker/Dockerfile
          push: true
          tags: |
            registry.tgm.one/foligo/${{ env.TAG_LATEST_DASHBOARD }}
            registry.tgm.one/foligo/${{ env.TAG_COMMIT_DASHBOARD }}
          cache-from: type=registry,ref=registry.tgm.one/foligo/dashboard:buildcache-${{ github.ref_name }}
          cache-to: type=registry,ref=registry.tgm.one/foligo/dashboard:buildcache-${{ github.ref_name }},mode=max
          build-args: |
            TURBO_API=http://turbo-cache.turbo-cache.svc.cluster.local:3000
            TURBO_TEAM=foligo
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}

  build-sites:
    runs-on: tgmstudios-runners
    steps:
      - uses: actions/checkout@v4

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TGM Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tgm.one
          username: robot$foligo+github
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Sites Tag Names
        run: |
          echo "${{ steps.extract_branch.outputs.branch }}"
          if [ ${{ steps.extract_branch.outputs.branch }} = "main" ]; then
            echo "TAG_LATEST_SITES=sites:latest" >> $GITHUB_ENV
            echo "TAG_COMMIT_SITES=sites:$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          elif [ ${{ steps.extract_branch.outputs.branch }} = "staging" ]; then
            echo "TAG_LATEST_SITES=sites-stage:latest" >> $GITHUB_ENV
            echo "TAG_COMMIT_SITES=sites-stage:$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          else
            exit 0
          fi

      - name: Build and push Sites
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          file: ./sites/.docker/Dockerfile
          push: true
          tags: |
            registry.tgm.one/foligo/${{ env.TAG_LATEST_SITES }}
            registry.tgm.one/foligo/${{ env.TAG_COMMIT_SITES }}
          cache-from: type=registry,ref=registry.tgm.one/foligo/sites:buildcache-${{ github.ref_name }}
          cache-to: type=registry,ref=registry.tgm.one/foligo/sites:buildcache-${{ github.ref_name }},mode=max
          build-args: |
            TURBO_API=http://turbo-cache.turbo-cache.svc.cluster.local:3000
            TURBO_TEAM=foligo
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}

  deploy-rancher:
    needs: [build-api, build-dashboard, build-sites]
    runs-on: tgmstudios-runners
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Redeploy Rancher
        run: |
          url='https://rancher.tgm.one'
          cluster=c-lx99g
          token=${{ secrets.RANCHER_TOKEN }}
          ts=$(date -u +%s)

          redeploy() {
              local app=$1
              local image="registry.tgm.one/foligo/$app:latest"
              local api_path="$url/k8s/clusters/$cluster/apis/apps/v1/namespaces/$namespace/deployments/$app"
              local http_code
              http_code=$(curl -s -o /dev/stderr -w "%{http_code}" -u "$token" -k \
                -X PATCH \
                -H "Content-Type: application/strategic-merge-patch+json" \
                -d "{\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"deployed-at\":\"$ts\"}},\"spec\":{\"containers\":[{\"name\":\"$app\",\"image\":\"$image\",\"imagePullPolicy\":\"Always\"}]}}}}" \
                "$api_path")
              if [ "$http_code" = "200" ]; then
                echo "[$app] ✓ updated → $image (HTTP $http_code)"
              else
                echo "[$app] ✗ FAILED → HTTP $http_code" >&2
                return 1
              fi
          }

          echo "${{ steps.extract_branch.outputs.branch }}"
          if [ ${{ steps.extract_branch.outputs.branch }} = "main" ]; then
              namespace=foligo
              redeploy "api"
              redeploy "dashboard"
              redeploy "sites"
          elif [ ${{ steps.extract_branch.outputs.branch }} = "staging" ]; then
              namespace=foligo-staging
              redeploy "api"
              redeploy "dashboard"
              redeploy "sites"
          else
              exit 0
          fi
