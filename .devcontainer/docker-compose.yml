services:
  workspace:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspace:cached
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sleep infinity

  db:
    image: postgres:17.5
    networks:
      - app-network
    environment:
      POSTGRES_DB: foligo
      POSTGRES_USER: foligo
      POSTGRES_PASSWORD: foligo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foligo -d foligo"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:5.4.1
    networks:
      - app-network
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "9013:8080"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    networks:
      - app-network
    ports:
      - "9014:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9015:9000"
      - "9016:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/foligo;
        mc anonymous set download local/foligo;
      "
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  app-network:
